<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar degli Amici – Ordina dal tavolo</title>
<style>
  :root {
    --bg: #fbf7f0; --card: #ffffff; --ink: #2b2118; --muted: #7a6a5a;
    --accent: #c2410c; --accent-soft: #fde7d6; --ok: #15803d; --line: #eadfd2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); padding-bottom: 110px;
  }
  header { background: var(--accent); color: #fff; padding: 22px 18px 18px; text-align: center; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 6px 0 0; opacity: .92; font-size: .95rem; }
  .demo-tag {
    display: inline-block; background: #fff3c4; color: #7a5a00; font-size: .75rem;
    padding: 3px 8px; border-radius: 999px; margin-top: 8px;
  }
  .table-picker { padding: 14px 18px 0; text-align: center; }
  .table-picker select { font-size: 1rem; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); }
  .table-badge { text-align: center; padding-top: 12px; font-weight: 700; color: var(--accent); }
  h2 { font-size: 1.15rem; margin: 26px 18px 6px; color: var(--accent); }
  .intro { margin: 0 18px; color: var(--muted); font-size: .92rem; }
  .list { padding: 8px 14px; display: grid; gap: 12px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; display: grid; grid-template-columns: 110px 1fr;
  }
  .item.off { opacity: .55; }
  .item img { width: 110px; height: 100%; min-height: 110px; object-fit: cover; }
  .info { padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
  .name { font-weight: 700; }
  .desc { color: var(--muted); font-size: .85rem; line-height: 1.3; }
  .row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .price { font-weight: 700; color: var(--accent); }
  .esaurito { font-size: .8rem; font-weight: 700; color: #b91c1c; }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button {
    width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent-soft);
    color: var(--accent); font-size: 1.1rem; font-weight: 700; cursor: pointer;
  }
  .qty button:disabled { opacity: .4; cursor: not-allowed; }
  .qty span { min-width: 18px; text-align: center; font-weight: 700; }
  .cart {
    position: fixed; left: 0; right: 0; bottom: 0; background: #fff;
    border-top: 1px solid var(--line); padding: 12px 16px; display: flex;
    align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 -6px 18px rgba(0,0,0,.06);
  }
  .cart .sum { font-size: .95rem; }
  .cart .sum strong { display: block; font-size: 1.15rem; }
  .btn {
    background: var(--ok); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 18px; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .btn:disabled { background: #b8b1a8; cursor: not-allowed; }
  footer { text-align: center; color: var(--muted); font-size: .8rem; padding: 18px; }
  .msg { text-align: center; padding: 40px 18px; color: var(--muted); }
  .serata { margin: 14px 14px 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
  .serata img { width: 100%; height: 170px; object-fit: cover; display: block; }
  .serata .sb { padding: 12px 14px; }
  .serata .sd { color: var(--accent); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .03em; }
  .serata h3 { margin: 4px 0 6px; font-size: 1.15rem; }
  .serata p { margin: 0; color: var(--muted); font-size: .92rem; line-height: 1.35; }
</style>
</head>
<body>

<header>
  <h1>Bar degli Amici</h1>
  <p>Benvenuti! Sfogliate, scegliete e ordinate dal tavolo.</p>
  <span class="demo-tag">Versione dimostrativa</span>
</header>

<div class="table-picker" id="tablePicker">
  <label for="tableSelect">Tavolo</label>
  <select id="tableSelect"></select>
</div>
<div class="table-badge" id="tableBadge" style="display:none"></div>

<div id="menu"><p class="msg">Caricamento del menu…</p></div>

<div class="cart">
  <div class="sum">Totale<strong id="total">0,00 €</strong></div>
  <button class="btn" id="sendBtn" disabled>Invia ordine</button>
</div>

<footer>Bar degli Amici · Via Esempio, 1 · Aperti tutti i giorni 18:00–02:00<br>Pagina dimostrativa: prezzi e piatti sono di esempio.</footer>

<script>
  // Numero WhatsApp del locale (formato internazionale, senza +). Finto per la demo.
  let WHATSAPP_NUMBER = "390000000000";  // sovrascritto da menu.json se la gestione ne ha impostato uno

  let menu = null;          // contenuto di menu.json
  const cart = {};          // id piatto -> quantità

  function euro(n) { return Number(n).toFixed(2).replace(".", ",") + " €"; }

  // Foto di riserva quando un piatto non ha ancora una foto
  function placeholderImg(p, color) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220">
      <rect width="100%" height="100%" fill="${color}"/>
      <text x="50%" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#fff">${p.nome}</text>
      <text x="50%" y="136" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,.85)">foto dimostrativa</text>
    </svg>`;
    return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
  }
  const COLORS = ["#f59e0b", "#d97706", "#b45309", "#92400e", "#7c2d12", "#fb923c", "#eab308", "#ec4899", "#9f1239", "#facc15", "#64748b", "#38bdf8"];

  function tableNumber() {
    return document.getElementById("tableSelect").value;
  }

  function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  }

  // Banner della serata: visibile solo se attivato dalla gestione
  function serataHtml() {
    const s = menu.serata;
    if (!s || !s.attiva) return "";
    const img = s.foto ? `<img src="${s.foto}" alt="">` : "";
    return `<div class="serata">${img}<div class="sb">
      <div class="sd">${esc(s.data)}</div>
      <h3>${esc(s.titolo)}</h3>
      <p>${esc(s.testo)}</p>
    </div></div>`;
  }

  function renderMenu() {
    const box = document.getElementById("menu");
    box.innerHTML = serataHtml() + menu.categorie.map(cat => {
      const items = menu.piatti.filter(p => p.categoria === cat.id);
      const cards = items.map((p, i) => {
        const idx = menu.piatti.indexOf(p);
        const img = p.foto ? p.foto : placeholderImg(p, COLORS[idx % COLORS.length]);
        const off = !p.disponibile;
        return `
          <div class="item ${off ? "off" : ""}">
            <img src="${img}" alt="${p.nome}">
            <div class="info">
              <div class="name">${p.nome}</div>
              <div class="desc">${p.descrizione}</div>
              ${off ? '<div class="esaurito">Esaurito</div>' : ""}
              <div class="row">
                <span class="price">${euro(p.prezzo)}</span>
                <div class="qty">
                  <button type="button" data-id="${p.id}" data-d="-1" aria-label="Togli" ${off ? "disabled" : ""}>−</button>
                  <span id="q-${p.id}">${cart[p.id] || 0}</span>
                  <button type="button" data-id="${p.id}" data-d="1" aria-label="Aggiungi" ${off ? "disabled" : ""}>+</button>
                </div>
              </div>
            </div>
          </div>`;
      }).join("");
      return `<h2>${cat.nome}</h2><p class="intro">${cat.nota}</p><div class="list">${cards}</div>`;
    }).join("");
    updateCart();
  }

  function updateCart() {
    let total = 0, count = 0;
    menu.piatti.forEach(p => {
      const q = cart[p.id] || 0;
      const el = document.getElementById("q-" + p.id);
      if (el) el.textContent = q;
      total += q * p.prezzo;
      count += q;
    });
    document.getElementById("total").textContent = euro(total);
    document.getElementById("sendBtn").disabled = count === 0;
  }

  function buildOrderMessage() {
    const lines = menu.piatti
      .filter(p => (cart[p.id] || 0) > 0)
      .map(p => `${cart[p.id]} x ${p.nome} (${euro(p.prezzo * cart[p.id])})`);
    const total = menu.piatti.reduce((s, p) => s + (cart[p.id] || 0) * p.prezzo, 0);
    return `Ordine tavolo ${tableNumber()}\n${lines.join("\n")}\nTotale: ${euro(total)}`;
  }

  document.addEventListener("click", e => {
    const btn = e.target.closest("button[data-id]");
    if (!btn || btn.disabled) return;
    const id = btn.dataset.id;
    cart[id] = Math.max(0, (cart[id] || 0) + parseInt(btn.dataset.d, 10));
    updateCart();
  });

  document.getElementById("sendBtn").addEventListener("click", () => {
    window.location.href = "https://wa.me/" + WHATSAPP_NUMBER + "?text=" + encodeURIComponent(buildOrderMessage());
  });

  function initTable() {
    const sel = document.getElementById("tableSelect");
    for (let i = 1; i <= 6; i++) {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = "Tavolo " + i;
      sel.appendChild(opt);
    }
    const fromUrl = Number(new URLSearchParams(window.location.search).get("tavolo"));
    if (fromUrl >= 1 && fromUrl <= 6) {
      sel.value = String(fromUrl);
      document.getElementById("tablePicker").style.display = "none";
      const badge = document.getElementById("tableBadge");
      badge.textContent = "Tavolo " + fromUrl;
      badge.style.display = "block";
    }
  }

  initTable();
  // Il menu è in menu.json: la gestione lo modifica, la pagina lo legge ad ogni apertura
  fetch("menu.json", { cache: "no-store" })
    .then(r => r.json())
    .then(data => {
      menu = data;
      if (menu.whatsapp) WHATSAPP_NUMBER = menu.whatsapp;
      // La serata diventa un piatto ordinabile se ha un prezzo maggiore di zero
      const s = menu.serata;
      if (s && s.attiva && Number(s.prezzo) > 0) {
        menu.categorie.unshift({ id: "serata", nome: "Serata", nota: "" });
        menu.piatti.unshift({
          id: "serata", categoria: "serata", nome: s.titolo, descrizione: s.data,
          prezzo: Number(s.prezzo), foto: s.foto || "", disponibile: true
        });
      }
      renderMenu();
    })
    .catch(() => {
      document.getElementById("menu").innerHTML = '<p class="msg">Menu non disponibile, riprova tra poco.</p>';
    });
</script>
</body>
</html>
